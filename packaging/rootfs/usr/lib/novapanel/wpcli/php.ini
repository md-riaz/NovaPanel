; WP-CLI only; the agent clears PHP_INI_SCAN_DIR and supplies a fixed environment.
auto_prepend_file =
auto_append_file =
user_ini.filename =
memory_limit = 256M
max_execution_time = 120
display_errors = Off
log_errors = Off
allow_url_fopen = On
extension = curl
extension = mbstring
extension = mysqlnd
extension = mysqli
extension = phar
extension = xml
extension = zip
