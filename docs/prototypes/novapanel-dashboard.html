<title>NovaPanel Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: fixed left sidebar + sticky topbar + routed main panel; hPanel-style
   consolidated nav, a per-site "Manage" dashboard, a live Jobs drawer, and a
   firewall safe-apply (deadman) confirm screen. Single-VPS scope, demo data. */
:root{
  --bg:#f5f6fb; --surface:#ffffff; --surface-2:#eef0f8; --surface-3:#e7e9f4;
  --border:#e4e6f1; --border-strong:#d3d6e6;
  --fg:#191b27; --muted:#676c82; --faint:#9499ad;
  --accent:#5b3df5; --accent-ink:#ffffff; --accent-weak:rgba(91,61,245,.10); --accent-line:rgba(91,61,245,.28);
  --good:#0f9d8f; --good-weak:rgba(15,157,143,.12);
  --warn:#c67908; --warn-weak:rgba(198,121,8,.13);
  --crit:#d93a40; --crit-weak:rgba(217,58,64,.12);
  --info:#3b6ef5; --info-weak:rgba(59,110,245,.12);
  --shadow:0 1px 2px rgba(22,24,40,.05),0 8px 24px -14px rgba(22,24,40,.25);
  --radius:14px; --radius-sm:10px;
  --ui:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0d14; --surface:#14161f; --surface-2:#1b1e2b; --surface-3:#232737;
  --border:#262a3a; --border-strong:#333850;
  --fg:#e9eaf3; --muted:#9a9fb6; --faint:#6b7089;
  --accent:#8b79ff; --accent-ink:#13101f; --accent-weak:rgba(139,121,255,.14); --accent-line:rgba(139,121,255,.34);
  --good:#2dd4bf; --good-weak:rgba(45,212,191,.14);
  --warn:#e7a33e; --warn-weak:rgba(231,163,62,.15);
  --crit:#ff6166; --crit-weak:rgba(255,97,102,.15);
  --info:#6f9bff; --info-weak:rgba(111,155,255,.15);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c0d14; --surface:#14161f; --surface-2:#1b1e2b; --surface-3:#232737;
  --border:#262a3a; --border-strong:#333850;
  --fg:#e9eaf3; --muted:#9a9fb6; --faint:#6b7089;
  --accent:#8b79ff; --accent-ink:#13101f; --accent-weak:rgba(139,121,255,.14); --accent-line:rgba(139,121,255,.34);
  --good:#2dd4bf; --good-weak:rgba(45,212,191,.14);
  --warn:#e7a33e; --warn-weak:rgba(231,163,62,.15);
  --crit:#ff6166; --crit-weak:rgba(255,97,102,.15);
  --info:#6f9bff; --info-weak:rgba(111,155,255,.15);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:700;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{display:block}
.ic{width:16px;height:16px;flex:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:262px 1fr;min-height:100%}
.sidebar{position:sticky;top:0;align-self:start;height:100vh;height:100dvh;background:var(--surface);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);z-index:50}
.sb-brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(145deg,var(--accent),#9b84ff);
  display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 4px 12px -4px var(--accent-line)}
.brand-name{font-weight:800;font-size:16px;letter-spacing:-.02em}
.brand-sub{font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.02em}
.server-card{margin:0 12px 10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface-2);display:flex;align-items:center;gap:10px;cursor:pointer;width:calc(100% - 24px)}
.server-card:hover{border-color:var(--border-strong)}
.server-meta{min-width:0;text-align:left}
.server-host{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.server-ip{font-size:11px;color:var(--muted)}
.nav{flex:1;overflow-y:auto;padding:4px 12px 16px;min-height:0}
.nav-group{margin-top:14px}
.nav-label{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:0 10px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;color:var(--muted);
  font-weight:600;font-size:13.5px;position:relative;width:100%;text-align:left}
.nav-item:hover{background:var(--surface-2);color:var(--fg)}
.nav-item.active{background:var(--accent-weak);color:var(--accent)}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);
  width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav-item .ic{width:18px;height:18px;flex:none}
.nav-badge{margin-left:auto;font-size:11px;font-weight:700;background:var(--surface-3);color:var(--muted);padding:1px 7px;border-radius:999px}
.nav-badge.warn{background:var(--warn-weak);color:var(--warn)}
.nav-badge.crit{background:var(--crit-weak);color:var(--crit)}
.sb-foot{border-top:1px solid var(--border);padding:12px;display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;
  font-weight:800;color:var(--accent);font-size:13px;flex:none}
.sb-foot .nm{font-weight:700;font-size:13px}
.sb-foot .rl{font-size:11px;color:var(--muted)}

/* ---------- main ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--surface) 86%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:11px max(16px,env(safe-area-inset-right,0px)) 11px max(16px,env(safe-area-inset-left,0px))}
.hamburger{display:none;width:34px;height:34px;border-radius:9px;border:1px solid var(--border);place-items:center;background:var(--surface);flex:none}
.crumb{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px;min-width:0;overflow:hidden}
.crumb a:hover{color:var(--accent)}
.crumb .sep{color:var(--faint)}
.crumb .dim{color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:10px;padding:7px 11px;min-width:150px;max-width:300px;flex:1}
.search input{border:0;background:none;outline:none;color:var(--fg);width:100%;font-size:13px;min-width:0}
.search .kbd{font-size:10px;color:var(--faint);border:1px solid var(--border-strong);border-radius:5px;padding:1px 5px;font-weight:700;flex:none}
.tb-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);display:grid;place-items:center;
  background:var(--surface);color:var(--muted);position:relative;flex:none}
.tb-btn:hover{color:var(--fg);border-color:var(--border-strong)}
.tb-btn .dot{position:absolute;top:6px;right:7px;min-width:15px;height:15px;padding:0 3px;border-radius:999px;background:var(--accent);
  color:var(--accent-ink);font-size:9px;font-weight:800;display:grid;place-items:center;border:2px solid var(--surface)}
.content{padding:22px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));max-width:1200px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
.page-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;font-weight:700;font-size:13.5px;
  border:1px solid var(--border-strong);background:var(--surface);color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn .ic{width:16px;height:16px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px -8px var(--accent-line)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{border-color:transparent;background:var(--surface-2)}
.btn-danger{background:var(--crit);border-color:var(--crit);color:#fff}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* cards & grids */
.grid{display:grid;gap:16px}
.cards-4{grid-template-columns:repeat(4,1fr)}
.cards-3{grid-template-columns:repeat(3,1fr)}
.cards-2{grid-template-columns:repeat(2,1fr)}
.span-2{grid-column:span 2}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:16px}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.card-h h3{font-size:14px;font-weight:700}
.card-h .ic{width:17px;height:17px;color:var(--muted)}
.card-h .more{margin-left:auto;color:var(--muted);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.card-h .more:hover{color:var(--accent)}

/* stat tile */
.tile{padding:15px 16px;display:flex;flex-direction:column;gap:7px}
.tile .lbl{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;font-weight:600}
.tile .lbl .ic{width:16px;height:16px;color:var(--faint)}
.tile .val{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1}
.tile .sub{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:5px}
.tile .trend.up{color:var(--good)} .tile .trend.down{color:var(--crit)}

/* meters */
.meter{display:flex;flex-direction:column;gap:7px}
.meter .mt{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600}
.meter .mt .v{color:var(--muted)}
.bar{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:999px;background:var(--accent)}
.bar>span.good{background:var(--good)} .bar>span.warn{background:var(--warn)} .bar>span.crit{background:var(--crit)}

/* badges / pills */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;
  background:var(--surface-3);color:var(--muted);white-space:nowrap}
.badge .dt{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.good{background:var(--good-weak);color:var(--good)}
.badge.warn{background:var(--warn-weak);color:var(--warn)}
.badge.crit{background:var(--crit-weak);color:var(--crit)}
.badge.info{background:var(--info-weak);color:var(--info)}
.badge.accent{background:var(--accent-weak);color:var(--accent)}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:540px}
table.tbl th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);
  padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
table.tbl td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover{background:var(--surface-2)}
.row-main{font-weight:700}
.row-sub{font-size:12px;color:var(--muted)}
.cell-actions{text-align:right;white-space:nowrap}
.linklike{color:var(--accent);font-weight:700;cursor:pointer}
.linklike:hover{text-decoration:underline}

/* site cards */
.site-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.site-card{display:flex;flex-direction:column;cursor:pointer;transition:border-color .12s,transform .12s}
.site-card:hover{border-color:var(--border-strong);transform:translateY(-2px)}
.site-top{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 12px}
.site-fav{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;font-weight:800;color:#fff;font-size:15px}
.site-id .nm{font-weight:800;font-size:15px;display:flex;align-items:center;gap:7px}
.site-id .ty{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;margin-top:1px}
.site-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;padding:4px 16px 14px}
.kv .k{font-size:11px;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.kv .v{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.site-foot{margin-top:auto;border-top:1px solid var(--border);padding:11px 16px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;font-weight:600}
.site-foot .btn{margin-left:auto}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;margin-bottom:18px}
.tab{padding:9px 13px;font-weight:700;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* services strip */
.svc{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border)}
.svc:last-child{border-bottom:0}
.svc .nm{font-weight:700;font-size:13px}
.svc .ver{font-size:11.5px;color:var(--muted)}
.svc .st{margin-left:auto}

/* list rows (jobs/audit mini) */
.lrow{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--border)}
.lrow:last-child{border-bottom:0}
.lrow .li{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--muted)}
.lrow .li.good{background:var(--good-weak);color:var(--good)}.lrow .li.warn{background:var(--warn-weak);color:var(--warn)}
.lrow .li.crit{background:var(--crit-weak);color:var(--crit)}.lrow .li.info{background:var(--info-weak);color:var(--info)}
.lrow .lt{min-width:0}
.lrow .lt .a{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.lrow .lt .b{font-size:12px;color:var(--muted)}
.lrow .lx{margin-left:auto;font-size:11.5px;color:var(--faint);white-space:nowrap;font-weight:600}

/* toggle switch */
.sw{width:38px;height:22px;border-radius:999px;background:var(--surface-3);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--accent)} .sw.on::after{left:18px}

/* code / notice */
.codeblock{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;overflow-x:auto;color:var(--fg);white-space:pre}
.notice{display:flex;gap:11px;padding:13px 15px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);align-items:flex-start}
.notice .ic{width:18px;height:18px;flex:none;margin-top:1px}
.notice.warn{background:var(--warn-weak);border-color:transparent;color:var(--warn)}
.notice.crit{background:var(--crit-weak);border-color:transparent;color:var(--crit)}
.notice.good{background:var(--good-weak);border-color:transparent;color:var(--good)}
.notice.accent{background:var(--accent-weak);border-color:transparent;color:var(--accent)}
.notice .nt{color:var(--fg)} .notice .nt .nh{font-weight:800;font-size:13.5px} .notice .nt .nb{font-size:12.5px;color:var(--muted);margin-top:2px}
.notice.warn .nt .nh,.notice.crit .nt .nh,.notice.good .nt .nh,.notice.accent .nt .nh{color:inherit}

/* banner */
.banner{display:flex;align-items:center;gap:13px;padding:13px 16px;border-radius:12px;background:var(--accent-weak);
  border:1px solid var(--accent-line);margin-bottom:18px}
.banner .ic{width:20px;height:20px;color:var(--accent);flex:none}
.banner .bt{min-width:0} .banner .bt .h{font-weight:800;font-size:13.5px} .banner .bt .s{font-size:12.5px;color:var(--muted)}
.banner .btn{margin-left:auto}

/* progress (jobs) */
.prog{height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.prog>span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s ease}
@keyframes stripe{to{background-position:22px 0}}
.prog.run>span{background-image:linear-gradient(135deg,rgba(255,255,255,.25) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.25) 50%,rgba(255,255,255,.25) 75%,transparent 75%);
  background-size:22px 22px;animation:stripe .7s linear infinite}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,11,20,.5);z-index:70;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,94vw);background:var(--surface);border-left:1px solid var(--border);
  z-index:80;transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px)}
.drawer.show{transform:none}
.drawer-h{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--border)}
.drawer-h h3{font-size:15px;font-weight:800}
.drawer-b{overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.job{border:1px solid var(--border);border-radius:12px;padding:13px 14px;background:var(--surface)}
.job .jh{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.job .jv{font-family:var(--mono);font-size:12.5px;font-weight:700}
.job .jx{margin-left:auto;font-size:11.5px;color:var(--faint);font-weight:600}
.job .jm{font-size:12px;color:var(--muted);margin-bottom:9px}
.job .jp{display:flex;align-items:center;gap:9px}
.job .jp .pct{font-size:11.5px;font-weight:700;color:var(--muted);width:34px;text-align:right;flex:none}

/* modal */
.modal-b{display:flex;flex-direction:column;gap:14px;padding:18px}
.modal-card{position:fixed;z-index:80;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,94vw);max-height:88vh;overflow:auto;
  background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);display:none;flex-direction:column}
.modal-card.show{display:flex}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border)}
.modal-h h3{font-size:16px;font-weight:800}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--border);flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:700}
.field .hint{font-size:11.5px;color:var(--muted)}
.input,select.input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface-2);
  color:var(--fg);font:inherit;font-size:13.5px;outline:none}
.input:focus{border-color:var(--accent)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .opt{flex:1;min-width:120px;border:1px solid var(--border-strong);border-radius:10px;padding:11px 12px;cursor:pointer;background:var(--surface-2)}
.seg .opt.sel{border-color:var(--accent);background:var(--accent-weak)}
.seg .opt .t{font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px}
.seg .opt .d{font-size:11.5px;color:var(--muted);margin-top:2px}
.steps{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700;color:var(--faint);padding:0 18px 0}
.steps .s.on{color:var(--accent)} .steps .s.done{color:var(--good)}
.secret{font-family:var(--mono);font-size:13px;background:var(--surface-2);border:1px dashed var(--accent-line);border-radius:10px;
  padding:12px 14px;word-break:break-all;color:var(--fg)}

/* countdown ring for firewall */
.countdown{display:flex;align-items:center;gap:14px}
.ring{width:66px;height:66px;flex:none}
.ring .bgc{stroke:var(--surface-3)} .ring .fgc{stroke:var(--warn);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring .cd{font-family:var(--mono);font-weight:700;font-size:15px;fill:var(--fg)}

.empty{text-align:center;color:var(--muted);padding:40px 16px}
.hr{height:1px;background:var(--border);margin:2px 0}
.flex{display:flex;align-items:center;gap:10px} .wrap{flex-wrap:wrap} .mla{margin-left:auto} .gap6{gap:6px} .col{flex-direction:column;align-items:stretch}

/* responsive */
@media (max-width:920px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:276px;transform:translateX(-100%);transition:transform .22s;box-shadow:var(--shadow)}
  .sidebar.show{transform:none}
  .hamburger{display:grid}
  .cards-4{grid-template-columns:repeat(2,1fr)} .cards-3{grid-template-columns:1fr} .span-2{grid-column:auto}
}
@media (max-width:560px){
  .cards-4{grid-template-columns:1fr} .cards-2{grid-template-columns:1fr}
  .search{min-width:0} .page-head h1{font-size:19px}
}

        <div class="flex gap6"><span class="badge good">new</span> Per-site PHP OPcache tuning profile</div>
      </div></div>
    <div class="card"><div class="card-h">${ic("shield")}<h3>How updates stay safe</h3></div>
      <div class="card-pad grid" style="gap:11px;font-size:13px;color:var(--muted)">
        <div class="flex gap6">${ic("check","ic")&&'<span style="color:var(--good)">'+ic("check","ic")+'</span>'} ed25519 signature verified <b style="color:var(--fg)">before</b> the manifest is parsed</div>
        <div class="flex gap6"><span style="color:var(--good)">${ic("check","ic")}</span> Refuses any version older than installed (no downgrade)</div>
        <div class="flex gap6"><span style="color:var(--good)">${ic("check","ic")}</span> Each artifact checked against the signed sha256 + size</div>
        <div class="flex gap6"><span style="color:var(--good)">${ic("check","ic")}</span> Applied in a job; rolls back if the restart health-check fails</div>
      </div></div>
  </div>`;
}

function vAudit(){
  const all=[...audit,...audit.map(a=>({...a,when:"3d ago"}))];
  return `<div class="page-head"><div><h1>Audit log</h1><p>Append-only · every privileged action, refusal and failure — written by the agent</p></div>
    <div class="head-actions"><button class="btn btn-sm">${ic("file")}Export</button></div></div>
    <div class="card"><div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Verb</th><th>Actor</th><th>Outcome</th><th>Detail</th><th>When</th></tr></thead>
      <tbody>${all.map(a=>`<tr><td class="mono row-main">${a.verb}</td><td class="mono" style="font-size:12px">${esc(a.actor)}</td>
        <td><span class="badge ${a.out==='ok'?'good':a.out==='refused'?'crit':'warn'}">${a.out}</span></td>
        <td class="row-sub">${esc(a.code)}</td><td class="row-sub">${a.when}</td></tr>`).join("")}</tbody>
    </table></div></div>`;
}

/* ---------------- router ---------------- */
const TITLES={dashboard:["Overview"],websites:["Websites"],databases:["Databases"],backups:["Backups"],
  firewall:["Firewall"],dns:["DNS"],users:["Users & roles"],tokens:["API tokens"],updates:["Updates"],audit:["Audit log"]};
function route(){
  const h=(location.hash.replace(/^#/,"")||"dashboard");
  const [r,arg]=h.split("/");
  let html,crumb;
  if(r==="site"&&arg){const s=siteBy(arg); html=vSite(arg);
    crumb=`<a href="#websites">Websites</a><span class="sep">${ic("chevr","ic")}</span><span class="dim">${s?esc(s.domain):arg}</span>`;}
  else{
    const map={dashboard:vDashboard,websites:vWebsites,databases:vDatabases,backups:vBackups,firewall:vFirewall,
      dns:vDns,users:vUsers,tokens:vTokens,updates:vUpdates,audit:vAudit};
    const fn=map[r]||vDashboard;
    html=fn();
    crumb=`<span class="dim">${(TITLES[r]||["Overview"])[0]}</span>`;
  }
  $("#view").innerHTML=html;
  $("#crumb").innerHTML=crumb;
  renderSidebar(r==="site"?"site":r);
  window.scrollTo(0,0);
  $("#sidebar").classList.remove("show"); $("#scrim").classList.remove("show");
  if(r==="firewall"&&armed) paintArmed();
}
window.addEventListener("hashchange",route);

/* ---------------- jobs drawer ---------------- */
function renderJobs(){
  $("#jobsBody").innerHTML=jobs.map(j=>`<div class="job"><div class="jh"><span class="badge ${jobState(j.state)}">${j.state}</span>
    <span class="jv">${j.verb}</span><span class="jx">${j.id}</span></div>
    <div class="jm">${esc(j.obj)}</div>
    ${j.state==="failed"?`<div class="notice crit" style="padding:9px 11px;font-size:12px">${ic("warn")}<div class="nt"><div class="nb" style="color:inherit">${esc(j.msg)}</div></div></div>
      <div class="flex gap6" style="margin-top:9px"><button class="btn btn-sm" onclick="retryJob('${j.id}')">Unlock &amp; retry</button></div>`
    :`<div class="jp"><div class="prog ${j.state==='running'?'run':''}" style="flex:1"><span style="width:${j.pct}%"></span></div><span class="pct mono">${j.pct}%</span></div>
      <div class="jm" style="margin:8px 0 0">${esc(j.msg)}</div>`}</div>`).join("");
  const n=runningJobs(); const dot=ce("jobsDot"); dot.textContent=n; dot.style.display=n?"grid":"none";
}
function openJobs(){renderJobs();$("#drawer").classList.add("show");$("#scrim").classList.add("show");}
function closeDrawer(){$("#drawer").classList.remove("show");$("#scrim").classList.remove("show");}
function retryJob(id){const j=jobs.find(x=>x.id===id);if(!j)return;j.state="running";j.pct=5;j.msg="stale lock removed · re-reading packs";renderJobs();route();toast("Repository unlocked — verify re-queued");}

/* ---------------- modal ---------------- */
function modal(html){$("#modal").innerHTML=html;$("#modal").classList.add("show");$("#scrim").classList.add("show");}
function closeModal(){$("#modal").classList.remove("show");$("#scrim").classList.remove("show");}

function newDb(){modal(`<div class="modal-h">${ic("db")}<h3>New database</h3>
  <button class="tb-btn" style="margin-left:auto;width:32px;height:32px" onclick="closeModal()">${ic("x","ic")}</button></div>
  <div class="modal-b">
    <div class="field"><label>Database name</label><input class="input mono" id="dbn" value="wp_lumina_newsite"><div class="hint">A least-privilege user bound to 127.0.0.1 is created automatically.</div></div>
    <div class="field"><label>Attach to site</label><select class="input"><option>shop.lumina.co</option><option>api.lumina.co</option><option>— none —</option></select></div>
  </div>
  <div class="modal-f"><button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="showSecret('Database password','M9x!q2',document.getElementById('dbn').value,'database')">Create database</button></div>`);}

function newToken(){modal(`<div class="modal-h">${ic("token")}<h3>New API token</h3>
  <button class="tb-btn" style="margin-left:auto;width:32px;height:32px" onclick="closeModal()">${ic("x","ic")}</button></div>
  <div class="modal-b">
    <div class="field"><label>Name</label><input class="input" value="ci-staging-deploy"></div>
    <div class="field"><label>Scopes</label><div class="flex wrap gap6">
      ${["system:read","sites:read","sites:write","deploy","databases:read","backups:read"].map((s,i)=>`<span class="tag" style="cursor:pointer;${i<4?'border-color:var(--accent);color:var(--accent)':''}">${s}</span>`).join("")}</div>
      <div class="hint">Destructive scopes (restore, firewall:write) need an automation grant and a stepped-up session.</div></div>
  </div>
  <div class="modal-f"><button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="showSecret('API token','npat_8sK2_7pQ…Z1','ci-staging-deploy','token')">Create token</button></div>`);}

function showSecret(title,pw,name,kind){
  const val=kind==="token"?"npat_8sK2_x7Qp2aLZ9m4Rk1vD0cBnH":("db_"+name+"_"+pw+"Kp93qZ");
  modal(`<div class="modal-h">${ic("key")}<h3>${title} — copy it now</h3></div>
  <div class="modal-b">
    <div class="notice warn" style="margin:0">${ic("warn")}<div class="nt"><div class="nh">Shown once</div>
      <div class="nb">This value is delivered through a one-time claim and is never stored or logged. You won't see it again.</div></div></div>
    <div class="field"><label>${kind==="token"?"Token":"Password"} for ${esc(name)}</label>
      <div class="secret" id="secretv">${esc(val)}</div></div>
  </div>
  <div class="modal-f"><button class="btn" id="copyBtn" onclick="copySecret()">Copy</button>
    <button class="btn btn-primary" onclick="closeModal();toast('${title} created')">Done</button></div>`);}
function copySecret(){const t=$("#secretv").textContent;
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{$("#copyBtn").textContent="Copied ✓";})
   .catch(()=>{const r=document.createRange();r.selectNodeContents($("#secretv"));getSelection().removeAllRanges();getSelection().addRange(r);$("#copyBtn").textContent="Selected";});}

/* restore flow */
function restoreFlow(target){modal(`<div class="modal-h">${ic("save")}<h3>Restore ${esc(target)}</h3></div>
  <div class="modal-b">
    <div class="notice crit" style="margin:0">${ic("warn")}<div class="nt"><div class="nh">This overwrites live data</div>
      <div class="nb">A pre-restore snapshot is taken first, the data is restored into a scratch DB, validated, then swapped in. Needs a fresh TOTP.</div></div></div>
    <div class="field"><label>Type the target name to confirm</label><input class="input mono" placeholder="${esc(target)}"></div>
    <div class="field"><label>TOTP code</label><input class="input mono" placeholder="123 456" inputmode="numeric"></div>
  </div>
  <div class="modal-f"><button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn btn-danger" onclick="closeModal();toast('Restore job queued with pre-restore snapshot (demo)')">Restore</button></div>`);}

/* create-site wizard */
let wz={step:0,type:"wordpress"};
function wizard(){wz={step:0,type:"wordpress"};paintWizard();}
function paintWizard(){
  const steps=["Type","Domain","Settings","Review"];
  const body=[
   ()=>`<div class="seg" style="flex-direction:column">
     ${[["wordpress","WordPress","Core + wp-config, checksum-verified install","globe"],
        ["php","PHP site","Nginx + per-site PHP-FPM pool","cpu"],
        ["static","Static site","Served directly by Nginx, no PHP","file"]].map(([v,t,d])=>
       `<div class="opt ${wz.type===v?'sel':''}" onclick="wz.type='${v}';paintWizard()"><div class="t">${ic("check","ic")&&t} ${wz.type===v?ic("check","ic"):""}</div><div class="d">${d}</div></div>`).join("")}</div>`,
   ()=>`<div class="field"><label>Primary domain</label><input class="input mono" value="newsite.lumina.co" id="wzdom">
     <div class="hint">DNS should point to ${server.ip}. A Let's Encrypt certificate is issued after the site is created.</div></div>
     <div class="field"><label>Also add</label><label class="flex gap6" style="font-weight:600;font-size:13px"><span class="sw on"></span> www.newsite.lumina.co</label></div>`,
   ()=>`<div class="field"><label>PHP version</label><select class="input" ${wz.type==='static'?'disabled':''}><option>8.3 (recommended)</option><option>8.2</option></select></div>
     <div class="field"><label>Database</label><label class="flex gap6" style="font-weight:600;font-size:13px"><span class="sw ${wz.type!=='static'?'on':''}"></span> Create a MariaDB database + user</label></div>
     <div class="field"><label>Git deploy</label><label class="flex gap6" style="font-weight:600;font-size:13px"><span class="sw"></span> Connect a repository (optional)</label></div>`,
   ()=>`<div class="grid" style="gap:10px">
     <div class="flex"><span class="row-sub mla" style="margin-left:0;width:120px">Type</span><b>${typeLabel(wz.type)}</b></div>
     <div class="flex"><span class="row-sub" style="width:120px">Domain</span><b class="mono">newsite.lumina.co</b></div>
     <div class="flex"><span class="row-sub" style="width:120px">PHP</span><b>${wz.type==='static'?'—':'8.3'}</b></div>
     <div class="flex"><span class="row-sub" style="width:120px">TLS</span><b>Let's Encrypt after create</b></div>
     <div class="notice accent" style="margin-top:6px">${ic("bolt")}<div class="nt"><div class="nb" style="color:inherit">Creates the Unix user, docroot, FPM pool, Nginx vhost and database, then issues the certificate — as one job you can watch in the drawer.</div></div></div></div>`
  ][wz.step]();
  modal(`<div class="modal-h">${ic("plus")}<h3>New website</h3>
    <div class="steps mla">${steps.map((s,i)=>`<span class="s ${i===wz.step?'on':i<wz.step?'done':''}">${i<wz.step?'✓':i+1}·${s}</span>`).join('<span style="color:var(--faint)">›</span>')}</div></div>
    <div class="modal-b">${body}</div>
    <div class="modal-f">${wz.step>0?'<button class="btn" onclick="wz.step--;paintWizard()">Back</button>':'<button class="btn" onclick="closeModal()">Cancel</button>'}
      ${wz.step<3?'<button class="btn btn-primary" onclick="wz.step++;paintWizard()">Continue</button>'
        :'<button class="btn btn-primary" onclick="closeModal();createSiteJob()">Create website</button>'}</div>`);
}
function createSiteJob(){jobs.unshift({id:"job_"+Math.random().toString(36).slice(2,6),verb:"site.create",
  obj:"newsite.lumina.co (wordpress)",state:"running",pct:12,msg:"creating unix user + docroot"});renderJobs();toast("Creating website — follow it in Jobs");openJobs();}

/* firewall deadman */
let armed=false, armT=null, armLeft=900;
function armFirewall(){armed=true;armLeft=900;location.hash="firewall";setTimeout(paintArmed,30);}
function paintArmed(){
  const box=ce("fwArmed"); if(!box)return;
  const draw=()=>{const r=28,c=2*Math.PI*r,off=c*(1-armLeft/900);
    const mm=String(Math.floor(armLeft/60)).padStart(2,"0"),ss=String(armLeft%60).padStart(2,"0");
    box.innerHTML=`<div class="notice warn" style="margin-bottom:16px;align-items:center">
      <div class="countdown"><svg class="ring" viewBox="0 0 66 66"><circle class="bgc" cx="33" cy="33" r="${r}" fill="none" stroke-width="6"/>
        <circle class="fgc" cx="33" cy="33" r="${r}" fill="none" stroke-width="6" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 33 33)"/>
        <text class="cd" x="33" y="38" text-anchor="middle">${mm}:${ss}</text></svg></div>
      <div class="nt"><div class="nh">Change applied — confirm you're still connected</div>
        <div class="nb">A new rule set is live. Confirm from this page within the countdown or it auto-reverts to the previous rules. Open a fresh tab to the panel to be sure you're not locked out.</div></div>
      <div class="flex gap6" style="align-self:center"><button class="btn btn-sm" onclick="revertFw()">Revert now</button>
        <button class="btn btn-sm btn-primary" onclick="confirmFw()">I'm still connected — confirm</button></div></div>`;};
  draw(); clearInterval(armT);
  armT=setInterval(()=>{armLeft-=7; if(armLeft<=0){clearInterval(armT);revertFw();return;} if(ce("fwArmed"))draw(); else clearInterval(armT);},1000);
}
function confirmFw(){clearInterval(armT);armed=false;ce("fwArmed").innerHTML="";toast("Firewall change confirmed — revert cancelled");}
function revertFw(){clearInterval(armT);armed=false;if(ce("fwArmed"))ce("fwArmed").innerHTML="";toast("Reverted to the previous rules");}

/* site tabs (demo) */
function siteTab(el,i){el.parentElement.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));el.classList.add("active");
  if(i>0)toast(el.textContent.trim()+" — section is interactive in the full build");}

/* toast */
let toastT=null;
function toast(msg){let t=ce("toast");if(!t){t=document.createElement("div");t.id="toast";
  t.style.cssText="position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--fg);color:var(--bg);font-weight:700;font-size:13px;padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);max-width:90vw";
  document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity="1";clearTimeout(toastT);toastT=setTimeout(()=>t.style.opacity="0",2200);}

/* theme */
function initTheme(){let t=null;try{t=localStorage.getItem("np-theme")}catch(e){}
  if(t)document.documentElement.setAttribute("data-theme",t);syncThemeIcon();}
function toggleTheme(){const cur=document.documentElement.getAttribute("data-theme");
  const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;const next=dark?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);try{localStorage.setItem("np-theme",next)}catch(e){}syncThemeIcon();}
function syncThemeIcon(){const cur=document.documentElement.getAttribute("data-theme");
  const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  ce("themeIcon").setAttribute("href",dark?"#i-sun":"#i-moon");}

/* wire up */
ce("themeBtn").onclick=toggleTheme;
ce("jobsBtn").onclick=openJobs;
ce("drawerClose").onclick=closeDrawer;
ce("ham").onclick=()=>{$("#sidebar").classList.toggle("show");$("#scrim").classList.toggle("show");};
ce("scrim").onclick=()=>{closeDrawer();closeModal();$("#sidebar").classList.remove("show");};
ce("q").addEventListener("input",e=>{const v=e.target.value.toLowerCase();
  if(location.hash.replace("#","")!=="websites"&&v){location.hash="websites";setTimeout(()=>filterSites(v),40);return;}
  filterSites(v);});
function filterSites(v){const g=ce("siteGrid");if(!g)return;[...g.children].forEach(c=>{c.style.display=c.textContent.toLowerCase().includes(v)?"":"none";});}
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();ce("q").focus();}
  if(e.key==="Escape"){closeModal();closeDrawer();}});

initTheme(); renderJobs(); route();
</script>
